[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata-reliability-core"
version = "0.3.0"
description = "Provider-agnostic reliability primitives and offline audits for financial market data"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "JoshKZ"}]
keywords = ["market-data", "data-quality", "provenance", "quant", "finance", "csv", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
mdr-audit = "marketdata_reliability.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
  "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/JoshKZ/marketdata-reliability-core"
Issues = "https://github.com/JoshKZ/marketdata-reliability-core/issues"
Documentation = "https://github.com/JoshKZ/marketdata-reliability-core/tree/main/docs"
Changelog = "https://github.com/JoshKZ/marketdata-reliability-core/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["marketdata_reliability"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
